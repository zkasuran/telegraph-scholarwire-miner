version: "1"
kind: miner
id: 7325
slug: scholarwire-academic-search
protocol: generic
name: ScholarWire Academic Search
description: >
  Scholarly papers on a topic, read live from the OpenAlex works API at request time with
  Crossref as a fallback. Answers the ACADEMIC_SEARCH intent: it names the top match in one
  sentence (title, first author, year, venue and citation count) then lists the top three with
  authors, year, venue, citation count and DOI. Pass a topic or a whole question. No API key,
  nothing cached that can go stale.
base_url: https://telegraph-scholar.margyn.workers.dev

docs:
  documentation: https://telegraph-scholar.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: topic is a subject or a whole question, for example "CRISPR gene editing" or "papers on large language models". A whole question is accepted too.
    param: topic
    property: length
    value_num: 200
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language request, verbatim, for example "find recent papers on large
        language models". The miner reads the subject from it, so passing the whole question
        works as well as naming the topic.
    topic:
      type: string
      description: Subject to search for, for example "CRISPR gene editing" or "quantum computing".

output_schema:
  type: object
  properties:
    topic:
      type: string
      description: The subject the answer is for.
    matched_works:
      type: integer
      description: Total works the source reports for the topic.
    source_api:
      type: string
      description: Which API produced the results, OpenAlex or Crossref.
    top_title:
      type: string
      description: Title of the top-ranked paper.
    top_year:
      type: integer
      description: Publication year of the top-ranked paper.
    top_citations:
      type: integer
      description: Citation count of the top-ranked paper.
    results:
      type: array
      description: Top three papers, each with title, authors, year, venue, citations and DOI.
    confidence:
      type: number
      description: 0.96 for a direct OpenAlex read.
    summary:
      type: string
      description: One sentence naming the top paper, then a Readings block listing the top three.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /papers
    external_path: /papers
    method: GET
    description: >
      Papers for one topic, topic as a query parameter (?topic=CRISPR%20gene%20editing). Also
      accepts a whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - ACADEMIC_SEARCH

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: topic
        description: The subject the answer is for.
        source_path: topic
      - index: 1
        name: top_title
        description: Title of the top-ranked paper.
        source_path: top_title
      - index: 2
        name: summary
        description: One sentence naming the top paper, then a Readings block with the top three.
        source_path: summary
    integers:
      - index: 0
        name: matched_works
        description: Total works the source reports for the topic.
        source_path: matched_works
        multiplier: 1
      - index: 1
        name: top_citations
        description: Citation count of the top-ranked paper.
        source_path: top_citations
        multiplier: 1
  request:
    - endpoint: papers
      method: GET
      query_params:
        topic: { source: strings.0 }
